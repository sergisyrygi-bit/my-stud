<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model — картки</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="cards">
        <article class="card card--compact">
            <span class="card__badge">Нове</span>
            <h2 class="card__title">Компактна картка</h2>
            <p class="card__text">
                У цієї картки невеликий внутрішній відступ, тонка рамка та
                однакові зовнішні відступи з усіх боків.
            </p>
        </article>

        <article class="card card--spacious">
            <h2 class="card__title">Простора картка</h2>
            <p class="card__text">
                У цієї картки більший внутрішній відступ, товстіша рамка та
                нерівномірні зовнішні відступи.
            </p>
        </article>
    </main>
</body>
</html>
